  - DOMAIN-SUFFIX,taishinbank.com.tw
  - DOMAIN-SUFFIX,entiebank.com.tw
  - DOMAIN-SUFFIX,ctbcbank.com

  # =====================================================================
  # 外資在台子行
  # 皆列於金管會本國銀行名單；渣打使用全球 sc.com namespace。
  # =====================================================================
  - DOMAIN-SUFFIX,citibank.com.tw
  - DOMAIN-SUFFIX,sc.com
  - DOMAIN-SUFFIX,hsbc.com.tw
  - DOMAIN-SUFFIX,dbs.com.tw

  # =====================================================================
  # 純網路銀行
  # =====================================================================
  - DOMAIN-SUFFIX,nextbank.com.tw
  - DOMAIN-SUFFIX,linebank.com.tw
  - DOMAIN-SUFFIX,rakuten-bank.com.tw

  # =====================================================================
  # 信用卡 / 國際金流組織
  # =====================================================================
  - DOMAIN-SUFFIX,visa.com
  - DOMAIN-SUFFIX,mastercard.com
  - DOMAIN-SUFFIX,jcb.co.jp

  # =====================================================================
  # PayPal
  # paypal.com 已涵蓋 api.paypal.com / api-m.paypal.com / live.paypal.com；
  # 不納入 paypal-mktg.com，避免讓 marketing namespace 取得 BANKGOV privilege。
  # =====================================================================
  - DOMAIN-SUFFIX,paypal.com
  - DOMAIN-SUFFIX,paypalobjects.com
  - DOMAIN-SUFFIX,pphosted.com
  - DOMAIN-SUFFIX,paypal.me

  # =====================================================================
  # Stripe
  # =====================================================================
  - DOMAIN-SUFFIX,stripe.com
  - DOMAIN-SUFFIX,stripe.network
  - DOMAIN-SUFFIX,stripeusercontent.com

  # =====================================================================
  # Apple Pay
  # 不放整棵 apple.com，只保留已知支付端點。
  # =====================================================================
  - DOMAIN,applepay.apple.com
  - DOMAIN,ipay.apple.com

  # =====================================================================
  # Google Pay / Google Payments
  # 不放 googleapis.com；僅保留支付服務本身。
  # =====================================================================
  - DOMAIN,pay.google.com
  - DOMAIN,payments.google.com

  # =====================================================================
  # 台灣電子支付 / 行動支付
  # =====================================================================
  # LINE Pay
  - DOMAIN-SUFFIX,linepay.com
  - DOMAIN-SUFFIX,linepay.tw

  # 街口支付
  - DOMAIN-SUFFIX,jkopay.com

  # 歐付寶
  - DOMAIN-SUFFIX,opay.tw

  # ezPay 簡單付
  - DOMAIN-SUFFIX,ezpay.com.tw

  # 台灣 Pay / 台灣行動支付
  - DOMAIN-SUFFIX,twmp.com.tw
  - DOMAIN-SUFFIX,taiwanpay.com.tw

  # 悠遊付
  - DOMAIN-SUFFIX,easycard.com.tw

  # iPASS MONEY
  - DOMAIN-SUFFIX,i-pass.com.tw

  # icash Pay
  - DOMAIN-SUFFIX,icashpay.com.tw

  # 橘子支付
  - DOMAIN-SUFFIX,gamapay.com.tw

  # 全盈+PAY
  - DOMAIN-SUFFIX,pluspay.com.tw

  # 全支付
  - DOMAIN-SUFFIX,pxpayplus.com
  - DOMAIN-SUFFIX,pxpayplus.com.tw

  # =====================================================================
  # BNPL
  # ShopBack 僅保留 PayLater 端點，不放整棵 shopback.com。
  # Atome 以台灣 / 共用服務 namespace 為主，不預放 atome.sg。
  # =====================================================================
  - DOMAIN,paylater.shopback.com
  - DOMAIN-SUFFIX,atome.net
  - DOMAIN-SUFFIX,atome.tw

