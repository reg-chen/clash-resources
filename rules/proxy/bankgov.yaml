  - DOMAIN-SUFFIX,cathaybk.com.tw

  # 台北富邦：官網與網銀使用不同 namespace，避免整棵 fubon.com 全放行。
  - DOMAIN,www.fubon.com
  - DOMAIN,fbo.fubon.com
  - DOMAIN-SUFFIX,taipeifubon.com.tw
  - DOMAIN-SUFFIX,fubonbank.com.tw

  - DOMAIN-SUFFIX,o-bank.com
  - DOMAIN-SUFFIX,tcbbank.com.tw
  - DOMAIN-SUFFIX,ktb.com.tw
  - DOMAIN-SUFFIX,taipeistarbank.com.tw
  - DOMAIN-SUFFIX,hwataibank.com.tw
  - DOMAIN-SUFFIX,skbank.com.tw
  - DOMAIN-SUFFIX,sunnybank.com.tw
  - DOMAIN-SUFFIX,bop.com.tw
  - DOMAIN-SUFFIX,cotabank.com.tw
  - DOMAIN-SUFFIX,ubot.com.tw
  - DOMAIN-SUFFIX,feib.com.tw
  - DOMAIN-SUFFIX,yuantabank.com.tw
