  # MyCard
  # =====================================================================
  - DOMAIN-SUFFIX,mycard520.com
  - DOMAIN-SUFFIX,mycard520.net
  - DOMAIN-SUFFIX,mycard520.tw
  - DOMAIN-SUFFIX,mycard.com.tw
  - DOMAIN-SUFFIX,mycardpayment.com
  - DOMAIN-SUFFIX,mycardapi.com
  - DOMAIN-SUFFIX,mycardwallet.com
