  - DOMAIN-SUFFIX,landbank.com.tw
  - DOMAIN-SUFFIX,tcb-bank.com.tw
  - DOMAIN-SUFFIX,firstbank.com.tw
  - DOMAIN-SUFFIX,hncb.com.tw
  - DOMAIN-SUFFIX,bankchb.com
  - DOMAIN-SUFFIX,megabank.com.tw
  - DOMAIN-SUFFIX,tbb.com.tw
  - DOMAIN-SUFFIX,bok.com.tw
  - DOMAIN-SUFFIX,eximbank.com.tw

