  # =====================================================================
  # 台灣政府 / 公部門
  # gov.tw 已涵蓋 nat.gov.tw、各中央與地方機關子網域；避免重複列舉。
  # =====================================================================
  - DOMAIN-SUFFIX,gov.tw
  - DOMAIN-SUFFIX,gov.taipei

  # 國家圖書館 / 臺灣博碩士論文知識加值系統
  - DOMAIN-SUFFIX,ncl.edu.tw

  # =====================================================================
  # 公股 / 政策性金融機構
  # 以金管會現行本國銀行名單及銀行官方網域為主。
  # =====================================================================
