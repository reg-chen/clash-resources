name: Build PIA Mihomo Generator

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/pia-openvpn-generator.py
      - tools/pia-openvpn-gui.py
      - .github/workflows/build-pia-generator.yml

permissions:
  contents: read

jobs:
  build-windows:
    if: github.actor == 'reg-chen'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 PyInstaller

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile tools/pia-openvpn-generator.py tools/pia-openvpn-gui.py

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name PIA-Mihomo-Generator `
            --add-data "tools/pia-openvpn-generator.py;." `
            tools/pia-openvpn-gui.py

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: PIA-Mihomo-Generator-win-x64
          path: dist/PIA-Mihomo-Generator.exe
          if-no-files-found: error
