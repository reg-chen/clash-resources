name: Build VPN Mihomo Generator

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/pia_generator_core.py
      - tools/pia-openvpn-generator.py
      - tools/pia-openvpn-generator-impl.py
      - tools/pia-wireguard-generator.py
      - tools/surfshark-openvpn-generator.py
      - tools/pia-generator-gui.py
      - .github/workflows/build-pia-generator.yml

permissions:
  contents: read

jobs:
  build-windows:
    if: github.actor == 'reg-chen'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 PyInstaller cryptography

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile `
            tools/pia_generator_core.py `
            tools/pia-openvpn-generator.py `
            tools/pia-openvpn-generator-impl.py `
            tools/pia-wireguard-generator.py `
            tools/surfshark-openvpn-generator.py `
            tools/pia-generator-gui.py

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name VPN-Mihomo-Generator `
            --collect-all cryptography `
            --add-data "tools/pia-openvpn-generator.py;." `
            --add-data "tools/pia-openvpn-generator-impl.py;." `
            --add-data "tools/pia-wireguard-generator.py;." `
            --add-data "tools/surfshark-openvpn-generator.py;." `
            tools/pia-generator-gui.py

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: VPN-Mihomo-Generator-win-x64
          path: dist/VPN-Mihomo-Generator.exe
          if-no-files-found: error
