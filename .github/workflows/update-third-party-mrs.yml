name: Update third-party MRS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-third-party-mrs.yml'
      - 'tools/third-party-mrs-sources.json'
      - 'tools/build-third-party-mrs.py'
      - 'tools/mrs_provenance.py'
      - '.gitattributes'
      - 'tests/test_mrs_provenance.py'
      - 'tools/mrs_overlap.py'
      - 'tools/mrs_merge.py'
      - 'tools/activate-merged-mrs.py'
      - 'tools/migrate-third-party-mrs.py'
      - 'tools/cdn_purge_verify.py'
      - 'tests/test_mrs_merge.py'
      - 'tests/test_mrs_overlap.py'
      - 'rules/security/custom.txt'
      - 'rules/privacy/custom.txt'
      - 'rules/ads/custom.txt'
  schedule:
    - cron: '32 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: third-party-mrs
  cancel-in-progress: false
jobs:
  build:
    # MRS source pushes and scheduled runs are automatic.
    # Manual workflow_dispatch is reserved for the repository Owner.
    if: ${{ github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
      - name: Validate merged-MRS category separation and semantics
        run: python3 -m unittest discover -s tests -p 'test_mrs_*.py' -v
      - name: Download latest Mihomo
        shell: bash
        run: |
          set -euo pipefail
          url=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[] | select(.name | test("^mihomo-linux-amd64(-compatible)?-v[0-9].*\\.gz$")) | .browser_download_url' | head -1)
          test -n "$url"
          curl -fL --retry 3 "$url" -o /tmp/mihomo.gz
          gzip -dc /tmp/mihomo.gz > ./mihomo
          chmod +x ./mihomo
          ./mihomo -v
      - name: Convert updated providers
        run: python3 tools/build-third-party-mrs.py
      - name: Migrate providers after successful conversion
        run: python3 tools/migrate-third-party-mrs.py
      - name: Activate merged category MRS only after validation
        run: python3 tools/activate-merged-mrs.py
      - name: Show source overlap report
        if: always()
        shell: bash
        run: |
          if test -s /tmp/mrs-overlap.md; then
            cat /tmp/mrs-overlap.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -s /tmp/mrs-skipped.md; then
            cat /tmp/mrs-skipped.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit updated MRS
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A queued schedule can check out an older main; never force-push it.
          for attempt in 1 2 3; do
            if (( attempt > 1 )); then
              echo "::notice::Remote main advanced; rebuild on latest main ($attempt/3)"
              sleep $((attempt * 5))
              git fetch --no-tags origin main
              git reset --hard origin/main
              python3 tools/build-third-party-mrs.py
              python3 tools/migrate-third-party-mrs.py
              python3 tools/activate-merged-mrs.py
            fi

            git add -A -- sources/mrs rules/ads/mrs rules/privacy/mrs rules/security/mrs tools/third-party-mrs-sha256.json tools/third-party-mrs-provenance.json configs/desktop.yaml configs/android-firewall-only.yaml configs/ios-firewall-only.yaml configs/windows-firewall-only.yaml
            if git diff --cached --quiet; then
              echo 'No new MRS changes to push.'
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m 'chore(mrs): refresh third-party rule providers'
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::Could not push MRS after 3 rebuild attempts; never force-pushing."
          exit 1
      - name: Purge changed MRS paths, verify CDN
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Only MRS bytes need jsDelivr/Worker verification. Configs are
          # consumed through their own config route, not rules.reginald.win.
          git diff --name-only HEAD^ HEAD -- rules/ads/mrs rules/privacy/mrs rules/security/mrs > /tmp/mrs-changed
          python3 tools/cdn_purge_verify.py --paths-file /tmp/mrs-changed --verify-domain
