name: Update third-party MRS
on:
  # Path filters suppress empty commits; gate pushes by verified content below.
  push:
    branches: [main]
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: third-party-mrs
  cancel-in-progress: false
jobs:
  gate:
    # Only push events need path/empty-commit checks; cron and manual runs bypass it.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Permit source changes or a verified empty refresh commit
        id: decide
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "run=false" >> "$GITHUB_OUTPUT"
          subject="$(git log -1 --format=%s "$AFTER")"
          if [[ "$subject" == "build: refresh mrs" ]] &&
             [[ "$(git rev-list --parents -n 1 "$AFTER" | wc -w)" -eq 2 ]] &&
             [[ "$(git rev-parse "$AFTER^{tree}")" == "$(git rev-parse "$AFTER^1^{tree}")" ]]; then
            echo "Verified empty refresh commit."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Preserve the original push triggers for workflow/builder edits.
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            changed="$(git diff-tree --no-commit-id --name-only -r "$AFTER" -- .github/workflows/update-third-party-mrs.yml tools/third-party-mrs-sources.json tools/build-third-party-mrs.py tools/migrate-third-party-mrs.py)"
          else
            changed="$(git diff --name-only "$BEFORE" "$AFTER" -- .github/workflows/update-third-party-mrs.yml tools/third-party-mrs-sources.json tools/build-third-party-mrs.py tools/migrate-third-party-mrs.py)"
          fi
          if [[ -n "$changed" ]]; then
            printf 'Build source changed:\n%s\n' "$changed"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping unrelated push."
          fi

  build:
    needs: gate
    if: ${{ always() && (github.event_name != 'push' || needs.gate.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Download latest Mihomo
        shell: bash
        run: |
          set -euo pipefail
          url=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[] | select(.name | test("^mihomo-linux-amd64(-compatible)?-v[0-9].*\\.gz$")) | .browser_download_url' | head -1)
          test -n "$url"
          curl -fL --retry 3 "$url" -o /tmp/mihomo.gz
          gzip -dc /tmp/mihomo.gz > ./mihomo
          chmod +x ./mihomo
          ./mihomo -v
      - name: Convert updated providers
        run: python3 tools/build-third-party-mrs.py
      - name: Migrate providers after successful conversion
        run: python3 tools/migrate-third-party-mrs.py
      - name: Commit updated MRS
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add rules/ads/mrs rules/privacy/mrs rules/security/mrs tools/third-party-mrs-sha256.json configs/desktop.yaml configs/android-firewall-only.yaml configs/ios-firewall-only.yaml configs/windows-firewall-only.yaml
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(mrs): refresh third-party rule providers'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Purge changed MRS and config paths, verify CDN
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD^ HEAD -- rules/ads/mrs rules/privacy/mrs rules/security/mrs configs/desktop.yaml configs/android-firewall-only.yaml configs/ios-firewall-only.yaml configs/windows-firewall-only.yaml > /tmp/mrs-changed
          while IFS= read -r path; do
            test -n "$path" || continue
            url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$path"
            printf 'Purging %s\n' "$url"
            response=$(curl -fsSL --retry 3 "$url")
            echo "$response" | jq -e --arg key "/gh/${GITHUB_REPOSITORY}@main/$path" '.status == "finished" and (.paths[$key].throttled != true) and (.paths[$key].providers | all(. == true))' > /dev/null
            expected=$(sha256sum "$path" | cut -d' ' -f1)
            matched=false
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -fsSL --max-time 30 "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$path" -o /tmp/cdn-mrs; then
                actual=$(sha256sum /tmp/cdn-mrs | cut -d' ' -f1)
                if [[ "$expected" == "$actual" ]]; then matched=true; break; fi
              fi
              sleep 5
            done
            test "$matched" = true || { echo "::error::CDN mismatch: $path"; exit 1; }
            if [[ "$path" == rules/* ]]; then
              # Own domain is a path-preserving rules/ alias; verify after CDN purge.
              rules_url="https://rules.reginald.win/${path#rules/}"
              verified=false
              for attempt in 1 2 3 4 5 6 7 8; do
                if curl -fsSL --max-time 30 "$rules_url" -o /tmp/own-domain-mrs; then
                  actual=$(sha256sum /tmp/own-domain-mrs | cut -d' ' -f1)
                  if [[ "$expected" == "$actual" ]]; then verified=true; break; fi
                fi
                sleep 5
              done
              test "$verified" = true || { echo "::error::Domain mismatch: $rules_url"; exit 1; }
            fi
          done < /tmp/mrs-changed
