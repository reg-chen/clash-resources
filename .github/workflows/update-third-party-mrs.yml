name: Update third-party MRS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-third-party-mrs.yml'
      - 'tools/third-party-mrs-sources.json'
      - 'tools/build-third-party-mrs.py'
      - 'tools/mrs_build.py'
      - 'tools/mrs_provenance.py'
      - '.gitattributes'
      - 'tests/test_mrs_provenance.py'
      - 'tools/mrs_overlap.py'
      - 'tools/mrs_merge.py'
      - 'tools/mrs_ip.py'
      - 'tools/activate-merged-mrs.py'
      - 'tools/migrate-third-party-mrs.py'
      - 'tools/cdn_purge_verify.py'
      - 'tests/test_mrs_merge.py'
      - 'tests/test_mrs_overlap.py'
      - 'tests/test_mrs_publication.py'
      - 'rules/security/custom.txt'
      - 'rules/privacy/custom.txt'
      - 'rules/ads/custom.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: third-party-mrs
  cancel-in-progress: false
jobs:
  build:
    # Source pushes remain automatic; Cloudflare Worker handles periodic dispatch.
    # workflow_dispatch (Worker or manual) is reserved for the repository Owner.
    if: ${{ github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
      - name: Validate merged-MRS category separation and semantics
        run: python3 -m unittest discover -s tests -p 'test_mrs_*.py' -v
      - name: Resolve latest Mihomo release
        id: mihomo_release
        shell: bash
        run: |
          set -euo pipefail
          tag=unavailable
          url=''
          if response=$(curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest); then
            found_tag=$(jq -r '.tag_name // empty' <<< "$response") || found_tag=''
            found_url=$(jq -r '[.assets[] | select(.name | test("^mihomo-linux-amd64(-compatible)?-v[0-9].*[.]gz$")) | .browser_download_url][0] // empty' <<< "$response") || found_url=''
            if [[ "$found_tag" =~ ^[A-Za-z0-9._-]+$ && "$found_url" == https://github.com/MetaCubeX/mihomo/releases/download/* ]]; then
              tag="$found_tag"
              url="$found_url"
            fi
          fi
          printf 'tag=%s\nurl=%s\n' "$tag" "$url" >> "$GITHUB_OUTPUT"
      - name: Restore Mihomo cache
        id: mihomo_cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/mihomo-cache/mihomo
          key: mihomo-linux-amd64-stable-v1-${{ steps.mihomo_release.outputs.tag }}
          restore-keys: |
            mihomo-linux-amd64-stable-v1-
      - name: Reuse validated Mihomo or download new release
        id: mihomo
        shell: bash
        env:
          MIHOMO_URL: ${{ steps.mihomo_release.outputs.url }}
          CACHE_EXACT: ${{ steps.mihomo_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          cache_file="$RUNNER_TEMP/mihomo-cache/mihomo"
          mkdir -p "$(dirname "$cache_file")"
          cache_ok=false
          if [[ -s "$cache_file" ]] && chmod +x "$cache_file" && "$cache_file" -v >/dev/null 2>&1; then
            cache_ok=true
          fi

          downloaded=false
          source_label=""
          if [[ "$CACHE_EXACT" == "true" && "$cache_ok" == "true" ]]; then
            source_label="current release cache"
          else
            if [[ -n "$MIHOMO_URL" ]]; then
              archive="$RUNNER_TEMP/mihomo-download.gz"
              candidate="$RUNNER_TEMP/mihomo-candidate"
              if curl -fL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 120 "$MIHOMO_URL" -o "$archive" \
                 && gzip -t "$archive" \
                 && gzip -dc "$archive" > "$candidate" \
                 && chmod +x "$candidate" \
                 && "$candidate" -v; then
                install -m 755 "$candidate" "$cache_file"
                downloaded=true
                source_label="new release download"
              else
                echo '::warning::Mihomo download/verification failed; trying previous valid cache.'
              fi
            else
              echo '::warning::Could not resolve current Mihomo release; trying previous valid cache.'
            fi
          fi
          if [[ "$downloaded" != "true" && "$cache_ok" != "true" ]]; then
            echo '::error::No valid Mihomo executable is available from download or cache.'
            exit 1
          fi
          if [[ -z "$source_label" ]]; then
            source_label="previous release fallback cache"
          fi
          install -m 755 "$cache_file" ./mihomo
          ./mihomo -v
          printf 'downloaded=%s\n' "$downloaded" >> "$GITHUB_OUTPUT"
          printf '**Mihomo binary:** %s\n' "$source_label" >> "$GITHUB_STEP_SUMMARY"
      - name: Cache newly verified Mihomo
        if: steps.mihomo.outputs.downloaded == 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/mihomo-cache/mihomo
          key: mihomo-linux-amd64-stable-v1-${{ steps.mihomo_release.outputs.tag }}
      - name: Convert updated providers
        run: python3 tools/build-third-party-mrs.py
      - name: Migrate providers after successful conversion
        run: python3 tools/migrate-third-party-mrs.py
      - name: Activate merged category MRS only after validation
        run: python3 tools/activate-merged-mrs.py
      - name: Validate published MRS and profiles
        run: MRS_REQUIRE_CURRENT=1 python3 -m unittest discover -s tests -p 'test_mrs_*.py' -v
      - name: Commit updated MRS
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A queued run can check out an older main; never force-push it.
          for attempt in 1 2 3; do
            if (( attempt > 1 )); then
              echo "::notice::Remote main advanced; rebuild on latest main ($attempt/3)"
              sleep $((attempt * 5))
              git fetch --no-tags origin main
              git reset --hard origin/main
              python3 tools/build-third-party-mrs.py
              python3 tools/migrate-third-party-mrs.py
              python3 tools/activate-merged-mrs.py
              MRS_REQUIRE_CURRENT=1 python3 -m unittest discover -s tests -p 'test_mrs_*.py' -v
            fi

            git add -A -- sources/mrs rules/ads/mrs rules/privacy/mrs rules/security/mrs tools/third-party-mrs-sha256.json tools/third-party-mrs-provenance.json configs/desktop.yaml configs/android-firewall-only.yaml configs/ios-firewall-only.yaml configs/windows-firewall-only.yaml
            if git diff --cached --quiet; then
              echo 'No new MRS changes to push.'
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m 'chore(mrs): refresh third-party rule providers'
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::Could not push MRS after 3 rebuild attempts; never force-pushing."
          exit 1
      - name: Show source overlap report
        if: always()
        shell: bash
        run: |
          if test -s /tmp/mrs-overlap.md; then
            cat /tmp/mrs-overlap.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -s /tmp/mrs-skipped.md; then
            cat /tmp/mrs-skipped.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Purge changed MRS paths, verify CDN
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Only MRS bytes need jsDelivr/Worker verification. Configs are
          # consumed through their own config route, not rules.reginald.win.
          git diff --name-only HEAD^ HEAD -- rules/ads/mrs rules/privacy/mrs rules/security/mrs > /tmp/mrs-changed
          python3 tools/cdn_purge_verify.py --paths-file /tmp/mrs-changed --verify-domain
