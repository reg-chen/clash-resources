name: Purge jsDelivr cache

on:
  push:
    branches:
      - main
    paths:
      - "rules/**"
      - "icons/**"
  workflow_dispatch:
    inputs:
      path:
        description: "Path under rules/ or icons/, e.g. rules/ads/mrs/combined.mrs or icons/Cloudflare.svg"
        required: true
        type: string

permissions:
  contents: read

# Serialize rule and icon purges; configs and overrides use GitHub Raw.
concurrency:
  group: jsdelivr-purge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  purge:
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Collect changed paths
        id: paths
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DISPATCH_PATH: ${{ inputs.path }}
        run: |
          set -euo pipefail
          : > /tmp/jsdelivr-paths

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "$DISPATCH_PATH" != rules/* && "$DISPATCH_PATH" != icons/* ]] ||
               [[ "$DISPATCH_PATH" == "rules/" || "$DISPATCH_PATH" == "icons/" ]]; then
              echo "::error::Only files under rules/ or icons/ may be purged."
              exit 1
            fi
            printf '%s\n' "$DISPATCH_PATH" > /tmp/jsdelivr-paths
          elif [[ -n "${BEFORE:-}" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "$BEFORE" "$AFTER" -- rules/ icons/ > /tmp/jsdelivr-paths
          else
            git diff-tree --no-commit-id --name-only -r "$AFTER" -- rules/ icons/ > /tmp/jsdelivr-paths
          fi

          # This workflow serves rule files (including MRS) and icons only.
          # The MRS builder also purges its own generated MRS when publishing.
          grep -E '^(rules|icons)/.+' /tmp/jsdelivr-paths | sort -u > /tmp/jsdelivr-filtered || true
          mv /tmp/jsdelivr-filtered /tmp/jsdelivr-paths
          echo "Paths to purge:"
          cat /tmp/jsdelivr-paths

      - name: Purge and verify jsDelivr content
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/cdn_purge_verify.py --paths-file /tmp/jsdelivr-paths
