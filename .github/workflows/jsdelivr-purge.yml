name: Purge jsDelivr cache

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      path:
        description: "Repository path to purge, e.g. icons/WARP-Cloudflare.svg"
        required: true
        type: string

permissions:
  contents: read

# Serialize pushes; jobs targeting mutable @main must not purge in parallel.
concurrency:
  group: jsdelivr-purge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  purge:
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Collect changed paths
        id: paths
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          DISPATCH_PATH: ${{ inputs.path }}
        run: |
          set -euo pipefail
          : > /tmp/jsdelivr-paths

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            printf '%s\n' "${DISPATCH_PATH}" >> /tmp/jsdelivr-paths
          elif [[ -n "${BEFORE:-}" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "$BEFORE" "$AFTER" >> /tmp/jsdelivr-paths
          fi

          # Empty commits can be used for an explicit one-off purge without
          # touching repository content:
          #   jsDelivr purge: rules/direct/process.yaml
          if [[ ! -s /tmp/jsdelivr-paths && "${COMMIT_MESSAGE:-}" == "jsDelivr purge: "* ]]; then
            printf '%s\n' "${COMMIT_MESSAGE#jsDelivr purge: }" >> /tmp/jsdelivr-paths
          fi

          # Build scripts, workflow definitions, tests and docs are not consumed from jsDelivr.
          # Keep manually dispatched paths explicit (including emergency overrides).
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            grep -Ev '^(\.github/|tools/|tests/|docs/|README([.]|$)|LICENSE([.]|$))' /tmp/jsdelivr-paths > /tmp/jsdelivr-filtered || true
            mv /tmp/jsdelivr-filtered /tmp/jsdelivr-paths
          fi
          sort -u -o /tmp/jsdelivr-paths /tmp/jsdelivr-paths
          echo "Paths to purge:"
          cat /tmp/jsdelivr-paths

      - name: Purge and verify jsDelivr content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import time
          from pathlib import Path
          from urllib.parse import quote

          repo = os.environ["GITHUB_REPOSITORY"]
          paths_file = Path("/tmp/jsdelivr-paths")
          paths = [p.strip() for p in paths_file.read_text().splitlines() if p.strip()]

          if not paths:
              print("No paths to purge.")
              raise SystemExit(0)

          def run_curl(url: str, *, output: Path | None = None) -> tuple[int, str]:
              cmd = [
                  "curl",
                  "--location",
                  "--silent",
                  "--show-error",
                  "--connect-timeout", "10",
                  "--max-time", "30",
              ]
              if output is not None:
                  cmd += ["--output", str(output)]
              else:
                  cmd += ["--output", "/dev/null"]
              cmd += ["--write-out", "%{http_code}", url]
              proc = subprocess.run(cmd, check=False, capture_output=True, text=True)
              if proc.returncode != 0:
                  raise RuntimeError(f"curl failed for {url}: {proc.stderr.strip()}")
              try:
                  return int(proc.stdout[-3:]), proc.stderr
              except ValueError as exc:
                  raise RuntimeError(f"Unable to parse HTTP status for {url}: {proc.stdout!r}") from exc

          def purge(path: str) -> None:
              encoded = quote(path, safe="/")
              url = f"https://purge.jsdelivr.net/gh/{repo}@main/{encoded}"
              print(f"Purging {url}")
              proc = subprocess.run(
                  ["curl", "--fail", "--silent", "--show-error", url],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              print(proc.stdout.strip())
              try:
                  payload = json.loads(proc.stdout)
              except json.JSONDecodeError as exc:
                  raise RuntimeError(f"Invalid jsDelivr purge response for {path}") from exc

              if payload.get("status") != "finished":
                  raise RuntimeError(f"jsDelivr purge did not finish for {path}: {payload}")

              key = f"/gh/{repo}@main/{path}"
              entry = (payload.get("paths") or {}).get(key)
              if not entry:
                  raise RuntimeError(f"jsDelivr purge response omitted {key}: {payload}")
              if entry.get("throttled"):
                  reset = int(entry.get("throttlingReset") or 0)
                  print(
                      f"::warning::jsDelivr throttled {path}; "
                      f"retry after about {reset} seconds. No further purge "
                      "requests will be sent for this path in this run.",
                      flush=True,
                  )
                  return False, reset

              providers = entry.get("providers") or {}
              failed = [name for name, ok in providers.items() if ok is not True]
              if failed:
                  raise RuntimeError(f"jsDelivr purge provider failure for {path}: {providers}")
              return True, 0

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def refresh_main() -> str:
              # A queued run may start after newer pushes. Verify @main
              # against the *current* repository state, not the event SHA.
              remote = subprocess.run(
                  ["git", "ls-remote", "origin", "refs/heads/main"],
                  check=True, capture_output=True, text=True,
              ).stdout.split()[0]
              local = subprocess.run(
                  ["git", "rev-parse", "HEAD"],
                  check=True, capture_output=True, text=True,
              ).stdout.strip()
              if remote != local:
                  print(f"Refreshing checkout: {local[:12]} -> {remote[:12]}", flush=True)
                  subprocess.run(["git", "fetch", "--quiet", "origin", "main"], check=True)
                  subprocess.run(["git", "reset", "--hard", "FETCH_HEAD"], check=True)
                  local = subprocess.run(
                      ["git", "rev-parse", "HEAD"],
                      check=True, capture_output=True, text=True,
                  ).stdout.strip()
              return local

          failures: list[str] = []

          for path in paths:
              encoded = quote(path, safe="/")
              cdn_url = f"https://cdn.jsdelivr.net/gh/{repo}@main/{encoded}"
              matched = False
              last_actual = None
              last_status = None
              for revision_try in range(1, 3):
                  snapshot_sha = refresh_main()
                  local = Path(path)
                  expected_exists = local.is_file()
                  expected_sha = sha256_file(local) if expected_exists else None
                  print(
                      f"Verifying {path} at main={snapshot_sha[:12]}: "
                      f"expected SHA256={expected_sha if expected_exists else '<deleted>'}",
                      flush=True,
                  )

                  # Finished purge means providers accepted invalidation; it
                  # does not guarantee a fresh branch alias response yet.
                  purged, throttle_reset = purge(path)
                  checks = 16 if purged else 4
                  for attempt in range(1, checks + 1):
                      temp = Path("/tmp/jsdelivr-verify.bin")
                      temp.unlink(missing_ok=True)
                      try:
                          status, _ = run_curl(cdn_url, output=temp)
                      except RuntimeError as exc:
                          print(f"Verify {path} {attempt}/{checks}: {exc}", flush=True)
                          status = 0

                      last_status = status
                      last_actual = sha256_file(temp) if status == 200 and temp.exists() else None
                      if expected_exists:
                          matched = status == 200 and last_actual == expected_sha
                      else:
                          matched = status in (404, 410)

                      print(
                          f"Verify {path} {attempt}/{checks}: HTTP {status}, "
                          f"SHA256={last_actual}, matched={matched}",
                          flush=True,
                      )
                      if matched:
                          break

                      # Keep verification reads bounded; do not re-purge a
                      # stale or throttled URL within the same revision.
                      if attempt < checks:
                          time.sleep(8)

                  if matched:
                      break
                  current_sha = refresh_main()
                  if purged and current_sha != snapshot_sha and revision_try == 1:
                      print(
                          f"main advanced during verification of {path}; "
                          "retry once using its current content.",
                          flush=True,
                      )
                      continue
                  reason = (
                      f"purge rate-limited (reset ~{throttle_reset}s)"
                      if not purged else "CDN stale after completed purge"
                  )
                  failures.append(
                      f"{path}: {reason}; main={snapshot_sha[:12]}, "
                      f"expected={expected_sha if expected_exists else '<deleted>'}, "
                      f"actual={last_actual}, HTTP={last_status}"
                  )
                  break

          if failures:
              print("\nVerification failures:")
              for failure in failures:
                  print(f"- {failure}")
              raise SystemExit(1)

          print("\nAll jsDelivr paths match the repository state.")
          PY
