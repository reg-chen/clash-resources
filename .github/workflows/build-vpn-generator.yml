name: Build VPN Mihomo Generator

on:
  push:
    branches: [main]
    paths:
      - "tools/uwp_firewall.py"
      - "tools/uwp_firewall.ps1"
      - "tools/vpn-generator-gui.py"
      - "tests/test_uwp_firewall.py"
      - "tests/test_vpn_gui.py"
      - ".github/workflows/build-vpn-generator.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/vpn-generator-gui.py"
      - "tests/test_vpn_gui.py"
      - ".github/workflows/build-vpn-generator.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: vpn-generator-artifact
  cancel-in-progress: false

jobs:
  build-windows:
    # Push comes only from a trusted main branch; manual remains Owner-only.
    if: github.event_name == 'push' || github.actor == github.repository_owner
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Restore pip wheel downloads
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/pip/Cache
          key: vpn-generator-pip-${{ runner.os }}-py314-v1

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install ttkbootstrap==2.2.7 PyInstaller cryptography
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore PyInstaller build cache
        uses: actions/cache/restore@v5
        with:
          path: build/VPN-Mihomo-Generator
          key: vpn-generator-pyinstaller-${{ runner.os }}-py314-ttk2-${{ hashFiles('tools/*.py', 'tests/*.py') }}-${{ github.run_id }}
          restore-keys: |
            vpn-generator-pyinstaller-${{ runner.os }}-py314-ttk2-

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile `
            tools/vpn-generator-gui.py `
            tools/vpn_generator_core.py `
            tools/mihomo_doh.py `
            tools/safe_paths.py `
            tools/uwp_firewall.py `
            tools/pia-openvpn-generator.py `
            tools/pia-wireguard-generator.py `
            tools/warp-wireguard-generator.py `
            tools/surfshark-openvpn-generator.py `
            tools/vpn-generator-gui.py

      - name: Test generators and GUI provider state
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        # All tests deliberately run, including cross-feature MRS config
        # tests, so the packaged GUI always corresponds to a consistent repo.
        run: python -m unittest discover -s tests -v

      - name: Smoke-test ttkbootstrap Windows UI
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path "tools").Path
          python -c "import importlib.util; p='tools/vpn-generator-gui.py'; s=importlib.util.spec_from_file_location('vpn_gui',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); w=m.MainWindow(); w.update(); w.destroy(); print('Tk smoke passed')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test UWP firewall backup on Windows (read-only)
        shell: pwsh
        run: |
          $script = (Resolve-Path "tools/uwp_firewall.ps1").Path
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $script, [ref]$null, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            throw "PowerShell syntax errors: $($parseErrors -join '; ')"
          }
          $backup = Join-Path $env:RUNNER_TEMP "uwp-firewall-smoke.json"
          $report = Join-Path $env:RUNNER_TEMP "uwp-firewall-smoke-report.json"
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -Mode backup -Path $backup -Report $report
          if ($LASTEXITCODE -ne 0) {
            throw "UWP firewall read-only backup failed: exit $LASTEXITCODE"
          }
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'tools'); import uwp_firewall; print(uwp_firewall.inspect_backup(Path(sys.argv[1])))" $backup
          if ($LASTEXITCODE -ne 0) {
            throw "UWP firewall backup JSON validation failed"
          }

      - name: Validate runtime syntax and topology
        shell: pwsh
        run: |
          node --check overrides/vpn-providers.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/vpn-providers.test.cjs

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name VPN-Mihomo-Generator `
            --collect-all cryptography `
            --collect-all ttkbootstrap `
            --hidden-import urllib.request `
            --hidden-import urllib.error `
            --add-data "tools/pia-openvpn-generator.py;." `
            --add-data "tools/pia-wireguard-generator.py;." `
            --add-data "tools/warp-wireguard-generator.py;." `
            --add-data "tools/surfshark-openvpn-generator.py;." `
            --add-data "tools/uwp_firewall.ps1;." `
            tools/vpn-generator-gui.py

      - name: Smoke-test frozen headless WARP entry point
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/VPN-Mihomo-Generator.exe").Path
          # --help never opens a GUI or touches live WARP credentials/API.
          $process = Start-Process -FilePath $exe -ArgumentList @("--warp", "--help") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Frozen WARP CLI failed: $($process.ExitCode)" }

      - name: Save PyInstaller build cache
        uses: actions/cache/save@v5
        with:
          path: build/VPN-Mihomo-Generator
          key: vpn-generator-pyinstaller-${{ runner.os }}-py314-ttk2-${{ hashFiles('tools/*.py', 'tests/*.py') }}-${{ github.run_id }}

      - name: Upload executable
        if: github.event_name != 'pull_request'
        id: uploaded_artifact
        uses: actions/upload-artifact@v7
        with:
          name: VPN-Mihomo-Generator-win-x64
          path: dist/VPN-Mihomo-Generator.exe
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Keep only the latest successful build artifact
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const names = ["VPN-Mihomo-Generator-win-x64","VPN-Mihomo-Generator.exe"];
            const keepId = Number('${{ steps.uploaded_artifact.outputs.artifact-id }}');
            if (!Number.isSafeInteger(keepId) || keepId <= 0) {
              core.setFailed('Upload action returned no valid artifact ID; no cleanup performed.');
              return;
            }
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            const current = artifacts.find(a => a.id === keepId);
            if (!current || current.workflow_run?.id !== context.runId) {
              core.setFailed('New upload artifact not found for this run; no cleanup performed.');
              return;
            }
            const old = artifacts.filter(a => a.id !== keepId && names.includes(a.name) && !a.expired);
            for (const artifact of old) {
              await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
              core.info(`Deleted old artifact ${artifact.name} (${artifact.id})`);
            }
            core.info(`Retained artifact ${current.name} (${keepId}); deleted ${old.length} older artifacts.`);
