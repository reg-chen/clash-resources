name: Build VPN Mihomo Generator

on:
  push:
    branches: [main]
    paths:
      - "tools/uwp_loopback.py"
      - "tools/vpn-generator-gui.py"
      - "tests/test_uwp_loopback.py"
      - "tests/test_vpn_gui.py"
      - ".github/workflows/build-vpn-generator.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/vpn-generator-gui.py"
      - "tools/uwp_loopback.py"
      - "tests/test_uwp_loopback.py"
      - "tests/test_vpn_gui.py"
      - ".github/workflows/build-vpn-generator.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: vpn-generator-artifact
  cancel-in-progress: false

jobs:
  build-windows:
    # Push comes only from a trusted main branch; manual remains Owner-only.
    if: github.event_name == 'push' || github.actor == github.repository_owner
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Restore pip wheel downloads
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/pip/Cache
          key: vpn-generator-pip-${{ runner.os }}-py314-v1

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install customtkinter==6.0.0 Pillow PyInstaller cryptography
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore PyInstaller build cache
        uses: actions/cache/restore@v5
        with:
          path: build/VPN-Mihomo-Generator
          key: vpn-generator-pyinstaller-${{ runner.os }}-py314-ctk6-${{ hashFiles('tools/*.py', 'tests/*.py') }}-${{ github.run_id }}
          restore-keys: |
            vpn-generator-pyinstaller-${{ runner.os }}-py314-ctk6-

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile `
            tools/vpn-generator-gui.py `
            tools/vpn_generator_core.py `
            tools/mihomo_doh.py `
            tools/safe_paths.py `
            tools/uwp_loopback.py `
            tools/pia-openvpn-generator.py `
            tools/pia-wireguard-generator.py `
            tools/warp-wireguard-generator.py `
            tools/surfshark-openvpn-generator.py `
            tools/vpn-generator-gui.py

      - name: Test generators and GUI provider state
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        # All tests deliberately run, including cross-feature MRS config
        # tests, so the packaged GUI always corresponds to a consistent repo.
        run: python -m unittest discover -s tests -v

      - name: Smoke-test CustomTkinter Windows UI
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path "tools").Path
          python -c "import importlib.util; p='tools/vpn-generator-gui.py'; s=importlib.util.spec_from_file_location('vpn_gui',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); w=m.MainWindow(); w.update(); w.destroy(); print('Tk smoke passed')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test checked UWP Loopback exemptions (read-only)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "uwp-loopback-smoke.json"
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'tools'); import uwp_loopback as u; p=Path(sys.argv[1]); d=u.backup(p); assert len(u.read_backup(p))==d['Total']; print(d)" $out
          if ($LASTEXITCODE -ne 0) {
            throw "UWP Loopback Win32 API backup failed"
          }

      - name: Validate runtime syntax and topology
        shell: pwsh
        run: |
          node --check overrides/vpn-providers.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/vpn-providers.test.cjs

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name VPN-Mihomo-Generator `
            --collect-all cryptography `
            --collect-all customtkinter `
            --hidden-import urllib.request `
            --hidden-import urllib.error `
            --add-data "tools/pia-openvpn-generator.py;." `
            --add-data "tools/pia-wireguard-generator.py;." `
            --add-data "tools/warp-wireguard-generator.py;." `
            --add-data "tools/surfshark-openvpn-generator.py;." `
            tools/vpn-generator-gui.py

      - name: Smoke-test frozen headless WARP entry point
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/VPN-Mihomo-Generator.exe").Path
          # --help never opens a GUI or touches live WARP credentials/API.
          $process = Start-Process -FilePath $exe -ArgumentList @("--warp", "--help") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Frozen WARP CLI failed: $($process.ExitCode)" }

      - name: Smoke-test frozen CustomTkinter GUI window
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/VPN-Mihomo-Generator.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $shown = $false
            for ($i = 0; $i -lt 24; $i++) {
              Start-Sleep -Milliseconds 500
              $windows = Get-Process -Name "VPN-Mihomo-Generator" -ErrorAction SilentlyContinue
              if ($windows | Where-Object { $_.MainWindowTitle -eq "VPN / Mihomo Generator" }) {
                $shown = $true
                break
              }
            }
            if (-not $shown) {
              throw "Frozen CustomTkinter GUI did not present its main window."
            }
            Write-Host "Frozen CustomTkinter GUI displayed successfully."
          }
          finally {
            Get-Process -Name "VPN-Mihomo-Generator" -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Save PyInstaller build cache
        uses: actions/cache/save@v5
        with:
          path: build/VPN-Mihomo-Generator
          key: vpn-generator-pyinstaller-${{ runner.os }}-py314-ctk6-${{ hashFiles('tools/*.py', 'tests/*.py') }}-${{ github.run_id }}

      - name: Upload executable
        if: github.event_name != 'pull_request'
        id: uploaded_artifact
        uses: actions/upload-artifact@v7
        with:
          name: VPN-Mihomo-Generator-win-x64
          path: dist/VPN-Mihomo-Generator.exe
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Keep only the latest successful build artifact
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const names = ["VPN-Mihomo-Generator-win-x64","VPN-Mihomo-Generator.exe"];
            const keepId = Number('${{ steps.uploaded_artifact.outputs.artifact-id }}');
            if (!Number.isSafeInteger(keepId) || keepId <= 0) {
              core.setFailed('Upload action returned no valid artifact ID; no cleanup performed.');
              return;
            }
            // Upload may complete before artifact metadata becomes queryable.
            // Use the upload action's ID directly; only delete old artifacts
            // after verifying this new artifact belongs to the current run.
            let current = null;
            for (let attempt = 1; attempt <= 6; attempt++) {
              try {
                current = (await github.rest.actions.getArtifact({
                  owner, repo, artifact_id: keepId
                })).data;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              if (current?.id === keepId &&
                  current.workflow_run?.id === context.runId &&
                  names.includes(current.name) && !current.expired) {
                break;
              }
              core.info('Waiting for new artifact metadata (' + attempt + '/6).');
              if (attempt < 6) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!current || current.id !== keepId ||
                current.workflow_run?.id !== context.runId ||
                !names.includes(current.name) || current.expired) {
              core.warning('Artifact metadata not yet verified; old artifacts untouched. Build and upload succeeded.');
              return;
            }
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            const old = artifacts.filter(a => a.id !== keepId && names.includes(a.name) && !a.expired);
            for (const artifact of old) {
              await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
              core.info(`Deleted old artifact ${artifact.name} (${artifact.id})`);
            }
            core.info(`Retained artifact ${current.name} (${keepId}); deleted ${old.length} older artifacts.`);
