name: Build VPN Mihomo Generator

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: vpn-generator-artifact
  cancel-in-progress: false

jobs:
  build-windows:
    if: github.actor == 'reg-chen'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 PyInstaller cryptography

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile `
            tools/vpn_generator_core.py `
            tools/pia-openvpn-generator.py `
            tools/pia-wireguard-generator.py `
            tools/warp-wireguard-generator.py `
            tools/surfshark-openvpn-generator.py `
            tools/vpn-generator-gui.py

      - name: Test generators and GUI provider state
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Validate runtime syntax and topology
        shell: pwsh
        run: |
          node --check overrides/vpn-providers.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/vpn-providers.test.cjs

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name VPN-Mihomo-Generator `
            --collect-all cryptography `
            --hidden-import urllib.request `
            --hidden-import urllib.error `
            --add-data "tools/pia-openvpn-generator.py;." `
            --add-data "tools/pia-wireguard-generator.py;." `
            --add-data "tools/warp-wireguard-generator.py;." `
            --add-data "tools/surfshark-openvpn-generator.py;." `
            tools/vpn-generator-gui.py

      - name: Upload executable
        id: uploaded_artifact
        uses: actions/upload-artifact@v7
        with:
          name: VPN-Mihomo-Generator-win-x64
          path: dist/VPN-Mihomo-Generator.exe
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Keep only the latest successful build artifact
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const names = ["VPN-Mihomo-Generator-win-x64","VPN-Mihomo-Generator.exe"];
            const keepId = Number('${{ steps.uploaded_artifact.outputs.artifact-id }}');
            if (!Number.isSafeInteger(keepId) || keepId <= 0) {
              core.setFailed('Upload action returned no valid artifact ID; no cleanup performed.');
              return;
            }
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            const current = artifacts.find(a => a.id === keepId);
            if (!current || current.workflow_run?.id !== context.runId) {
              core.setFailed('New upload artifact not found for this run; no cleanup performed.');
              return;
            }
            const old = artifacts.filter(a => a.id !== keepId && names.includes(a.name) && !a.expired);
            for (const artifact of old) {
              await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
              core.info(`Deleted old artifact ${artifact.name} (${artifact.id})`);
            }
            core.info(`Retained artifact ${current.name} (${keepId}); deleted ${old.length} older artifacts.`);
