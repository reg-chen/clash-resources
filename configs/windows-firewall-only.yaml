# =====================================================================
# Windows Firewall-only / No-VPN
# - No VPN proxy-providers / proxy-groups / VPN endpoints
# - No absolute P:\ paths; provider caches use paths relative to Mihomo HomeDir
# - Optional local private.yaml is supported; missing file acts as an empty rule set in Clash Party
# - Windows / process DIRECT exceptions retain desktop ordering
# - WebView2 still passes Security first, then bypasses Privacy / Ads
# =====================================================================

proxies:
  - name: DIRECT-DUMMY
    type: direct
    udp: true

ntp:
  enable: true
  write-to-system: true
  server: time.stdtime.gov.tw
  port: 123
  interval: 30

x-rule-provider-common: &RULE-PROVIDER
  interval: 3600
  proxy: DIRECT

rule-providers:
  security-combined:
    <<: *RULE-PROVIDER
    type: http
    behavior: domain
    format: mrs
    url: https://rules.reginald.win/security/mrs/combined.mrs
    path: ./rules/security/mrs/combined.mrs

  privacy-combined:
    <<: *RULE-PROVIDER
    type: http
    behavior: domain
    format: mrs
    url: https://rules.reginald.win/privacy/mrs/combined.mrs
    path: ./rules/privacy/mrs/combined.mrs

  ads-combined:
    <<: *RULE-PROVIDER
    type: http
    behavior: domain
    format: mrs
    url: https://rules.reginald.win/ads/mrs/combined.mrs
    path: ./rules/ads/mrs/combined.mrs

  CONFIRMED-REJECT:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/confirmed/custom.yaml
    path: ./rules/confirmed/custom.yaml

  direct-dns:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/direct/dns.yaml
    path: ./rules/direct/dns.yaml

  direct-process:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/direct/process.yaml
    path: ./rules/direct/process.yaml

  direct-windows:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/direct/windows.yaml
    path: ./rules/direct/windows.yaml

  direct-media:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/direct/media.yaml
    path: ./rules/direct/media.yaml

  # Local-only private rules. Clash Party treats a missing file as an empty provider;
  # creating/saving private.yaml later takes effect without changing this profile.
  direct-private:
    type: file
    behavior: classical
    path: ./private.yaml

  direct-webview2:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/direct/webview2.yaml
    path: ./rules/direct/webview2.yaml

  route-ai:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/proxy/ai.yaml
    path: ./rules/proxy/ai.yaml

  route-hls:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/proxy/hls.yaml
    path: ./rules/proxy/hls.yaml

  route-drm:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/proxy/drm.yaml
    path: ./rules/proxy/drm.yaml

  route-bankgov:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/proxy/bankgov.yaml
    path: ./rules/proxy/bankgov.yaml





  network-ports:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/network/ports.yaml
    path: ./rules/network/ports.yaml

















rules:
  - RULE-SET,CONFIRMED-REJECT,REJECT

  - RULE-SET,direct-dns,DIRECT
  - RULE-SET,direct-windows,DIRECT
  - RULE-SET,direct-process,DIRECT
  - RULE-SET,direct-media,DIRECT
  - RULE-SET,direct-private,DIRECT

  - RULE-SET,route-ai,DIRECT
  - RULE-SET,route-hls,DIRECT
  - RULE-SET,route-drm,DIRECT
  - RULE-SET,route-bankgov,DIRECT,no-resolve

  - RULE-SET,security-combined,REJECT
  # Network port restrictions (classical)
  - RULE-SET,network-ports,REJECT

  # WebView2 still passes Security, but bypasses Privacy / Ads.
  - RULE-SET,direct-webview2,DIRECT

  - RULE-SET,privacy-combined,REJECT
  - RULE-SET,ads-combined,REJECT
  - MATCH,DIRECT-DUMMY

ipv6: true
mode: rule
mixed-port: 7890
socks-port: 7891
port: 7892
redir-port: 0
tproxy-port: 0
allow-lan: false
unified-delay: true
tcp-concurrent: false
log-level: info
find-process-mode: strict
bind-address: '*'

lan-allowed-ips:
  - 0.0.0.0/0
  - ::/0
lan-disallowed-ips: []
authentication: []
skip-auth-prefixes:
  - 127.0.0.1/32
  - ::1/128

tun:
  enable: true
  stack: mips
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true
  dns-hijack:
    - any:53
  mtu: 1500
  device: Mihomo
  strict-route: true

