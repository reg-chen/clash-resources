ntp:
  enable: true
  write-to-system: true
  server: time.stdtime.gov.tw
  port: 123
  interval: 30

# 共用測速設定（YAML merge key）
x-test: &TEST
  # Google: 部分地區可能被干擾
  url: http://www.gstatic.com/generate_204

  # Cloudflare: 全球可達性通常較好
  #url: http://cp.cloudflare.com/generate_204

  # Microsoft: Windows 環境備選
  # url: http://edge-http.microsoft.com/captiveportal/generate_204

  # Apple: 回 200，不是 204
  # url: http://www.apple.com/library/test/success.html
  

# 共用測速設定（YAML merge key）
x-ss-test: &SS-TEST
  health-check:
    <<: *TEST
    enable: true
    expect-status: 
      - 204
      - 200
    timeout: 3000
    interval: 60

x-ss-test-slow: &SS-TEST-SLOW
  health-check:
    <<: *TEST
    enable: true
    expect-status:
      - 204
      - 200
    timeout: 3000
    interval: 300

# PIA endpoint topology is injected by Clash Party JS override.
# Without the override, PIA-only groups fail closed to REJECT; WG/SS paths remain usable.
x-pia-endpoint-override: true

x-pia-test: &PIA-TEST
  health-check:
    <<: *TEST
    enable: true
    #lazy: false
    expect-status:
      - 204
      - 200
    interval: 120
    timeout: 15000

x-pia-test-slow: &PIA-TEST-SLOW
  health-check:
    <<: *TEST
    enable: false
    expect-status:
      - 204
      - 200
    interval: 900
    timeout: 15000

proxy-providers:
  # PIA OpenVPN endpoint providers are generated by Clash Party JS override.
  # x-pia-test / x-pia-test-slow above remain the editable health-check policy source.

  #WG專區
  hls-wg-ss:
    type: file
    path: "P:\\Clash\\providers\\hls-wg-ss.yaml"
    <<: *SS-TEST
    
  china-wg-ss:
    type: file
    path: "P:\\Clash\\providers\\china-wg-ss.yaml"
    <<: *SS-TEST
    
  asia-extra-wg-ss:
    type: file
    path: "P:\\Clash\\providers\\asia-extra-wg-ss.yaml"
    <<: *SS-TEST
    
  global-extra-wg-ss:
    type: file
    path: "P:\\Clash\\providers\\global-extra-wg-ss.yaml"
    <<: *SS-TEST
    
# ================== 五種自動化組（微調穩定性） ==================

proxy-groups:
  # PIA hidden per-endpoint UDP/TCP groups are generated by Clash Party JS override.

  # =====================================================================
  # 最低延遲自動選（依測速選最穩定節點）
  # =====================================================================
  - name: AUTO-FAST
    type: url-test
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/fluent-emoji-flat/rocket.svg
    <<: *TEST
    interval: 900 
    tolerance: 50
    use:
      - hls-wg-ss
      - china-wg-ss
      - asia-extra-wg-ss
      - global-extra-wg-ss
  # =====================================================================
  # 故障自動切換（fallback：依順序 → 第一個掛掉才換下一個）
  # =====================================================================
  - name: AUTO-SAFE
    type: fallback
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/fluent-emoji-flat/shield.svg
    <<: *TEST
    interval: 900  
    tolerance: 120
    use:
      - hls-wg-ss
      - china-wg-ss
      - asia-extra-wg-ss
      - global-extra-wg-ss
  # =====================================================================
  # 負載平衡（挑選串流敏感的節點）
  # =====================================================================
  - name: LB-HLS
    type: load-balance
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/fluent-emoji-flat/repeat-button.svg
    strategy: round-robin
    use:
      - hls-wg-ss
  # =====================================================================
  # 負載平衡（Sticky：同一連線會黏著同節點）
  # =====================================================================
  - name: LB-STICKY
    type: load-balance
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/fluent-emoji-flat/repeat-button.svg
    strategy: sticky-sessions
    use:
      - hls-wg-ss
      - china-wg-ss
      - asia-extra-wg-ss
  # =====================================================================
  # 負載平衡（Non-sticky：每次請求可能不同節點）
  # =====================================================================
  - name: LB-ROBIN
    type: load-balance
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/fluent-emoji-flat/repeat-button.svg
    strategy: round-robin
    use:
      - hls-wg-ss
      - china-wg-ss
      - asia-extra-wg-ss
  # =====================================================================
  # 一致性哈希（登入 / API / 風控最穩，不跳不同 IP）
  # =====================================================================
  - name: LB-CONSISTENT
    type: load-balance
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/fluent-emoji-flat/repeat-button.svg
    strategy: consistent-hashing
    use:
      - hls-wg-ss
      - china-wg-ss
      - asia-extra-wg-ss
  # =====================================================================
  # DIRECT / PROXY 總切換（平常 DIRECT；出國時可整組切到 PROXY）
  # =====================================================================
  - name: DIRECT-PROXY
    type: select
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/fluent-emoji-flat/electric-plug.svg
    proxies:
      - DIRECT
      - PROXY

  # =====================================================================
  # 主選單（手動全控制：自動 / 負載 / 單線路 / DIRECT）
  # =====================================================================
  - name: PROXY
    type: select
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/fluent-emoji-flat/globe-with-meridians.svg
    proxies:
      - AUTO-FAST
      - AUTO-SAFE
      - LB-HLS
      - LB-CONSISTENT
      - LB-ROBIN
      - LB-STICKY
      - DIRECT
      - SS-ALL
      - OV-ALL
      - OV-ASIA
      - OV-MIDDLE-EAST
      - OV-EUROPE
      - OV-NORTH-AMERICA
      - OV-LATIN-AMERICA
      - OV-OCEANIA
      - OV-AFRICA
      

  # =====================================================================
  # AI 專用（預設直連，必要時可手動切換國家）
  # =====================================================================
  - name: AI-PROXY
    type: select
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/fluent-emoji-flat/robot.svg
    proxies: 
      - DIRECT
    use:
      - hls-wg-ss
      - asia-extra-wg-ss
      - global-extra-wg-ss

  # =====================================================================
  # HLSLB優先（預設 HLSLB，但可自由選國家）
  # =====================================================================
  - name: HLS-PROXY
    type: select
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/fluent-emoji-flat/film-frames.svg
    proxies:
      - LB-HLS
      - LB-CONSISTENT
      - LB-ROBIN
      - LB-STICKY
      - AUTO-FAST
      - AUTO-SAFE
      - DIRECT
      - SS-ALL
      - OV-ASIA

  # =====================================================================
  # 直連優先（預設 DIRECT，但可自由選國家）
  # =====================================================================
  - name: DRM-PROXY
    type: select
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/fluent-emoji-flat/globe-showing-asia-australia.svg
    proxies: 
      - DIRECT
      - LB-CONSISTENT
      - SS-ALL
      - OV-ASIA

  # =====================================================================
  # 銀行 / 政府專用（預設直連，必要時可手動切換國家）
  # =====================================================================
  - name: BANKGOV-PROXY
    type: select
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/fluent-emoji-flat/bank.svg
    proxies: 
      - DIRECT
      - LB-CONSISTENT
      - SS-ALL
      - OV-ASIA

  - name: SS-ALL
    type: select
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/Surfshark.svg
    use:
      - hls-wg-ss
      - china-wg-ss
      - asia-extra-wg-ss
      - global-extra-wg-ss

  - name: OV-ALL
    type: select
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/OpenVPN.png
    proxies:
      - REJECT  # PIA endpoint override not loaded
  - name: OV-ASIA
    type: select
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/fluent-emoji-flat/japanese-castle.svg
    proxies:
      - REJECT  # PIA endpoint override not loaded
  - name: OV-MIDDLE-EAST
    type: select
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/fluent-emoji-flat/mosque.svg
    proxies:
      - REJECT  # PIA endpoint override not loaded
  - name: OV-EUROPE
    type: select
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/fluent-emoji-flat/classical-building.svg
    proxies:
      - REJECT  # PIA endpoint override not loaded
  - name: OV-NORTH-AMERICA
    type: select
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/fluent-emoji-flat/statue-of-liberty.svg
    proxies:
      - REJECT  # PIA endpoint override not loaded
  - name: OV-LATIN-AMERICA
    type: select
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/fluent-emoji-flat/cactus.svg
    proxies:
      - REJECT  # PIA endpoint override not loaded
  - name: OV-OCEANIA
    type: select
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/fluent-emoji-flat/bridge-at-night.svg
    proxies:
      - REJECT  # PIA endpoint override not loaded
  - name: OV-AFRICA
    type: select
    icon: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/icons/fluent-emoji-flat/hut.svg
    proxies:
      - REJECT  # PIA endpoint override not loaded
# ================== 分流 ==================


# 共用 Rule Provider 設定（YAML merge key）
x-rule-provider-common: &RULE-PROVIDER
  interval: 3600
  proxy: DIRECT

rule-providers:
  # =====================================================================
  # 🟩 特殊DNS（強制直連）
  # =====================================================================
  direct-dns:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/direct/dns.yaml"
    path: "P:\\Clash\\rules\\direct\\dns.yaml"

  # =====================================================================
  # 🟩 特殊程式（強制直連）
  # =====================================================================
  direct-process:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/direct/process.yaml"
    path: "P:\\Clash\\rules\\direct\\process.yaml"

  # =====================================================================
  # 🟩 Windows core services (Update / Store / Phone Link / Auth / Push)
  # =====================================================================
  direct-windows:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/direct/windows.yaml"
    path: "P:\\Clash\\rules\\direct\\windows.yaml"
  
  # =====================================================================
  # 🟩 無法使用 VPN（特殊保護：必須 DIRECT）
  # =====================================================================
  direct-media:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/direct/media.yaml"
    path: "P:\\Clash\\rules\\direct\\media.yaml"

  # =====================================================================
  # 🟩 私有 DIRECT（僅本機，不上 GitHub）
  # =====================================================================
  direct-private:
    type: file
    behavior: classical
    path: "P:\\Clash\\rules\\direct\\private.yaml"

  # =====================================================================
  # 🟩 Windows core services (Update / Store / Phone Link / Auth / Push)
  # =====================================================================
  direct-webview2:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/direct/webview2.yaml"
    path: "P:\\Clash\\rules\\direct\\webview2.yaml"

  # =====================================================================
  # 🟧 AI-PROXY（第一順位 DIRECT，可手動切換路由）
  # =====================================================================
  route-ai:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/proxy/ai.yaml"
    path: "P:\\Clash\\rules\\proxy\\ai.yaml"

  # =====================================================================
  # 🟧 HLS-PROXY（第一順位 LB-HLS，可手動切換路由）
  # =====================================================================
  route-hls:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/proxy/hls.yaml"
    path: "P:\\Clash\\rules\\proxy\\hls.yaml"

  # =====================================================================
  # 🟧 DRM-PROXY（第一順位 DIRECT，可手動切換路由）
  # =====================================================================
  route-drm:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/proxy/drm.yaml"
    path: "P:\\Clash\\rules\\proxy\\drm.yaml"

  # =====================================================================
  # 🟦 台灣政府 / 公部門 / 銀行
  # =====================================================================
  route-bankgov:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/proxy/bankgov.yaml"
    path: "P:\\Clash\\rules\\proxy\\bankgov.yaml"

    # =====================================================================
  # 🟥 Security - Custom
  # =====================================================================
  security-custom:
    <<: *RULE-PROVIDER
    type: http
    behavior: domain
    format: text
    url: "https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/security/custom.txt"
    path: P:\\Clash\\rules\\security\\custom.txt

  # =====================================================================
  # 🟥 Malware / Phishing / Scam / C2
  # =====================================================================
  security-threat:
    <<: *RULE-PROVIDER
    type: http
    behavior: domain
    format: text
    url: "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif.mini-onlydomains.txt"
    path: P:\\Clash\\rules\\security\\threat.txt
    
  # =====================================================================
  # 🟥 Phishing / 詐騙網站 (強制拒絕)
  # =====================================================================
  security-phishing:
    <<: *RULE-PROVIDER
    type: http
    behavior: domain
    format: text
    url: "https://cdn.jsdelivr.net/gh/Phishing-Database/Phishing.Database@master/phishing-domains-ACTIVE.txt"
    path: P:\\Clash\\rules\\security\\phishing.txt

  # =====================================================================
  # 🟥 Dynamic DNS / Phishing / C2 Infrastructure
  # =====================================================================
  security-dyndns:
    <<: *RULE-PROVIDER
    type: http
    behavior: domain
    format: text
    url: "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/dyndns-onlydomains.txt"
    path: P:\\Clash\\rules\\security\\dyndns.txt

  # =====================================================================
  # 🟥 Risk Ports - Encrypted DNS / Internet Egress
  # =====================================================================
  security-riskport:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/security/riskport.yaml"
    path: P:\\Clash\\rules\\security\\riskport.yaml

  # =====================================================================
  # 🟥 Privacy - Custom
  # =====================================================================
  privacy-custom:
    <<: *RULE-PROVIDER
    type: http
    behavior: domain
    format: text
    url: "https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/privacy/custom.txt"
    path: P:\\Clash\\rules\\privacy\\custom.txt

  # =====================================================================
  # 🟥 Native Tracker - Amazon
