ntp:
  enable: true
  write-to-system: true
  server: time.stdtime.gov.tw
  port: 123
  interval: 30

external-controller-tls: 127.0.0.1:9443
external-doh-server: /dns-query
tls:
  certificate: "P:\\Clash\\certs\\mihomo-localhost.crt"
  private-key: "P:\\Clash\\certs\\mihomo-localhost.key"

# 共用測速設定（YAML merge key）
x-test: &TEST
  # Google: 部分地區可能被干擾
  # url: http://www.gstatic.com/generate_204

  # Cloudflare: 全球可達性通常較好
  url: http://cp.cloudflare.com/generate_204

  # Microsoft: Windows 環境備選
  # url: http://edge-http.microsoft.com/captiveportal/generate_204

  # Apple: 回 200，不是 204
  # url: http://www.apple.com/library/test/success.html

# VPN provider topology is injected by Clash Party JS override.
# Protocol families can be enabled independently.
x-vpn-provider-override: true
x-pia-openvpn: true
x-pia-wireguard: false
x-ss-openvpn: true
x-ss-wireguard: false

# PIA / Surfshark proxy-providers are generated by Clash Party JS override.
# WARP stays local because warp.yaml contains the WireGuard private key.
proxy-providers:
  warp-local:
    type: file
    path: "P:\\Clash\\providers\\warp.yaml"
    # WG is initialized on first connection; an eager check removes the
    # post-reboot need to press WARP latency test manually.
    # Retry every minute if the network is not yet ready at startup.
    health-check:
      <<: *TEST
      enable: true
      interval: 60
      timeout: 8000
      lazy: false
      expected-status: 204

# ================== 五種自動化組（微調穩定性） ==================

proxy-groups:
  # PIA endpoint groups and all PIA-* / SS-* regional groups are generated by JS.

  # =====================================================================
  # 全域模式
  # =====================================================================
  - name: GLOBAL
    type: select
    icon: https://icons.reginald.win/fluent-emoji-flat/world-map.svg
    proxies:
      - PROXY
      - REJECT

  # =====================================================================
  # 主選單（手動全控制：自動 / 負載 / 單線路 / DIRECT）
  # =====================================================================
  - name: PROXY
    type: select
    icon: https://icons.reginald.win/fluent-emoji-flat/globe-with-meridians.svg
    proxies:
      - AUTO-FAST
      - AUTO-SAFE
      - LB-HLS
      - LB-CONSISTENT
      - LB-ROBIN
      - LB-STICKY
      - WARP
      - AREA-COMBINE
      - DIRECT
      - REJECT

  # =====================================================================
  # DIRECT / PROXY 總切換（平常 DIRECT；出國時可整組切到 PROXY）
  # =====================================================================
  - name: DIRECT-PROXY
    type: select
    icon: https://icons.reginald.win/fluent-emoji-flat/satellite.svg
    proxies:
      - DIRECT
      - PROXY

  # =====================================================================
  # AI 專用（預設直連，必要時可手動切換國家）
  # =====================================================================
  - name: AI-PROXY
    type: select
    icon: https://icons.reginald.win/fluent-emoji-flat/robot.svg
    proxies:
      - DIRECT
      - REJECT
      - AREA-COMBINE

  # =====================================================================
  # HLSLB優先（預設 HLSLB，但可自由選國家）
  # =====================================================================
  - name: HLS-PROXY
    type: select
    icon: https://icons.reginald.win/fluent-emoji-flat/film-frames.svg
    proxies:
      - LB-HLS
      - LB-CONSISTENT
      - LB-ROBIN
      - LB-STICKY
      - WARP
      - AREA-COMBINE
      - AUTO-FAST
      - AUTO-SAFE
      - DIRECT
      - REJECT

  # =====================================================================
  # 地區敏感服務（預設 AREA-COMBINE，可退回 DIRECT）
  # =====================================================================
  - name: REGION-PROXY
    type: select
    icon: https://icons.reginald.win/fluent-emoji-flat/globe-showing-asia-australia.svg
    proxies:
      - AREA-COMBINE
      - DIRECT
      - REJECT

  # =====================================================================
  # 直連優先（預設 DIRECT，但可自由選國家）
  # =====================================================================
  - name: DRM-PROXY
    type: select
    icon: https://icons.reginald.win/fluent-emoji-flat/locked.svg
    proxies:
      - DIRECT
      - REJECT
      - LB-CONSISTENT
      - AREA-COMBINE

  # =====================================================================
  # 銀行 / 政府專用（預設直連，必要時可手動切換國家）
  # =====================================================================
  - name: BANKGOV-PROXY
    type: select
    icon: https://icons.reginald.win/fluent-emoji-flat/bank.svg
    proxies:
      - DIRECT
      - REJECT
      - LB-CONSISTENT
      - AREA-COMBINE

  # =====================================================================
  # WARP 專用（HiNet ↔ Fastly 路由 workaround）
  # =====================================================================
  - name: WARP-PROXY
    type: select
    # 推薦圖示（自行使用時取消下一行註解；預設不載入品牌 Logo）
    # icon: https://raw.githubusercontent.com/devicons/devicon/32fe1d3b3f36ad11f90ab94f7db59738139c2bf6/icons/cloudflare/cloudflare-original.svg
    default-selected: WARP
    proxies:
      - WARP
      - AREA-COMBINE
      - DIRECT
      - REJECT

  # WARP 節點容錯統一由此群組管理（自動納入 warp-local 的 warp-01、warp-02…）
  - name: WARP
    type: fallback
    hidden: true
    <<: *TEST
    interval: 60
    lazy: false
    use:
      - warp-local

  # =====================================================================
  # 亞洲同國跨供應商選擇（僅列出 PIA / Surfshark 都存在的國家）
  # =====================================================================
  - name: AREA-COMBINE
    type: select
    icon: https://icons.reginald.win/fluent-emoji-flat/airplane.svg
    proxies:
      - REJECT

  # =====================================================================
  # 最低延遲自動選（依測速選最穩定節點）
  # =====================================================================
  - name: AUTO-FAST
    type: url-test
    icon: https://icons.reginald.win/fluent-emoji-flat/rocket.svg
    <<: *TEST
    interval: 900
    tolerance: 50
    proxies:
      - REJECT

  # =====================================================================
  # 故障自動切換（fallback：依順序 → 第一個掛掉才換下一個）
  # =====================================================================
  - name: AUTO-SAFE
    type: fallback
    icon: https://icons.reginald.win/fluent-emoji-flat/shield.svg
    <<: *TEST
    interval: 900
    tolerance: 120
    proxies:
      - REJECT

  # =====================================================================
  # 負載平衡（挑選串流敏感的節點）
  # =====================================================================
  - name: LB-HLS
    type: load-balance
    icon: https://icons.reginald.win/fluent-emoji-flat/repeat-button.svg
    strategy: round-robin
    proxies:
      - REJECT

  # =====================================================================
  # 負載平衡（Sticky：同一連線會黏著同節點）
  # =====================================================================
  - name: LB-STICKY
    type: load-balance
    icon: https://icons.reginald.win/fluent-emoji-flat/repeat-button.svg
    strategy: sticky-sessions
    proxies:
      - REJECT

  # =====================================================================
  # 負載平衡（Non-sticky：每次請求可能不同節點）
  # =====================================================================
  - name: LB-ROBIN
    type: load-balance
    icon: https://icons.reginald.win/fluent-emoji-flat/repeat-button.svg
    strategy: round-robin
    proxies:
      - REJECT

  # =====================================================================
  # 一致性哈希（登入 / API / 風控最穩，不跳不同 IP）
  # =====================================================================
  - name: LB-CONSISTENT
    type: load-balance
    icon: https://icons.reginald.win/fluent-emoji-flat/repeat-button.svg
    strategy: consistent-hashing
    proxies:
      - REJECT

# ================== 分流 ==================

# 共用 Rule Provider 設定（YAML merge key）
x-rule-provider-common: &RULE-PROVIDER
  interval: 3600
  proxy: DIRECT

rule-providers:
  # =====================================================================
  # 🟥 Security（Threat / Phishing / DynDNS / Custom 合併 MRS）
  # =====================================================================
  combined-security:
    <<: *RULE-PROVIDER
    type: http
    behavior: domain
    format: mrs
    url: https://rules.reginald.win/security/mrs/combined.mrs
    path: P:\\Clash\\rules\\security\\mrs\\combined.mrs

  # =====================================================================
  # 🟥 Privacy（Native Trackers / Custom 合併 MRS）
  # =====================================================================
  combined-privacy:
    <<: *RULE-PROVIDER
    type: http
    behavior: domain
    format: mrs
    url: https://rules.reginald.win/privacy/mrs/combined.mrs
    path: P:\\Clash\\rules\\privacy\\mrs\\combined.mrs

  # =====================================================================
  # 🟥 Ads（Anti-AD / Loyalsoldier / Popup / Custom 合併 MRS）
  # =====================================================================
  combined-ads:
    <<: *RULE-PROVIDER
    type: http
    behavior: domain
    format: mrs
    url: https://rules.reginald.win/ads/mrs/combined.mrs
    path: P:\\Clash\\rules\\ads\\mrs\\combined.mrs

  # =====================================================================
  # ⛔ Confirmed blocks（高確定性，優先於 DIRECT）
  # =====================================================================
  reject-confirmed:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/confirmed/custom.yaml
    path: P:\\Clash\\rules\\confirmed\\custom.yaml

  # =====================================================================
  # 🟩 特殊DNS（強制直連）
  # =====================================================================
  direct-dns:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://rules.reginald.win/direct/dns.yaml"
    path: "P:\\Clash\\rules\\direct\\dns.yaml"

  # =====================================================================
  # 🟩 特殊程式（強制直連）
  # =====================================================================
  direct-process:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://rules.reginald.win/direct/process.yaml"
    path: "P:\\Clash\\rules\\direct\\process.yaml"

  # =====================================================================
  # 🟩 Windows core services (Update / Store / Phone Link / Auth / Push)
  # =====================================================================
  direct-windows:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://rules.reginald.win/direct/windows.yaml"
    path: "P:\\Clash\\rules\\direct\\windows.yaml"

  # =====================================================================
  # 🟩 無法使用 VPN（特殊保護：必須 DIRECT）
  # =====================================================================
  direct-media:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://rules.reginald.win/direct/media.yaml"
    path: "P:\\Clash\\rules\\direct\\media.yaml"

  # =====================================================================
  # 🟩 私有 DIRECT（僅本機，不上 GitHub）
  # =====================================================================
  direct-private:
    type: file
    behavior: classical
    path: "P:\\Clash\\rules\\direct\\private.yaml"

  # =====================================================================
  # 🟩 Windows core services (Update / Store / Phone Link / Auth / Push)
  # =====================================================================
  direct-webview2:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://rules.reginald.win/direct/webview2.yaml"
    path: "P:\\Clash\\rules\\direct\\webview2.yaml"

  # =====================================================================
  # 🟧 AI-PROXY（第一順位 DIRECT，可手動切換路由）
  # =====================================================================
  route-ai:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://rules.reginald.win/proxy/ai.yaml"
    path: "P:\\Clash\\rules\\proxy\\ai.yaml"

  # =====================================================================
  # 🟧 WARP-PROXY（HiNet ↔ Fastly 路由 workaround）
  # =====================================================================
  route-fastly:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://rules.reginald.win/proxy/fastly.yaml"
    path: "P:\\Clash\\rules\\proxy\\fastly.yaml"

  # =====================================================================
  # 🟧 HLS-PROXY（第一順位 LB-HLS，可手動切換路由）
  # =====================================================================
  route-hls:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://rules.reginald.win/proxy/hls.yaml"
    path: "P:\\Clash\\rules\\proxy\\hls.yaml"

  # =====================================================================
  # 🟧 DRM-PROXY（第一順位 DIRECT，可手動切換路由）
  # =====================================================================
  route-drm:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://rules.reginald.win/proxy/drm.yaml"
    path: "P:\\Clash\\rules\\proxy\\drm.yaml"

  # =====================================================================
  # 🟧 REGION-PROXY（地區 / 出口國別敏感）
  # =====================================================================
  route-region:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://rules.reginald.win/proxy/region.yaml"
    path: "P:\\Clash\\rules\\proxy\\region.yaml"

  # =====================================================================
  # 🟦 台灣政府 / 公部門 / 銀行
  # =====================================================================
  route-bankgov:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://rules.reginald.win/proxy/bankgov.yaml"
    path: "P:\\Clash\\rules\\proxy\\bankgov.yaml"

  # =====================================================================
  # 🟥 Risk Ports - Encrypted DNS / Internet Egress
  # =====================================================================
  network-ports:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: "https://rules.reginald.win/network/ports.yaml"
    path: P:\\Clash\\rules\\network\\ports.yaml

# ================== 分流規則 ==================
rules:
  # =====================================================================
  # ⛔ IPv6 Kill Switch
  # =====================================================================
  - IP-CIDR6,::/0,REJECT,no-resolve

  # =====================================================================
  # ⛔ Confirmed blocks (before DIRECT)
  # =====================================================================
  - RULE-SET,reject-confirmed,REJECT

  # =====================================================================
  # 🟩 DIRECT / PROXY 可切換
  # =====================================================================
  - RULE-SET,direct-dns,DIRECT-PROXY
  - RULE-SET,direct-windows,DIRECT-PROXY
  - RULE-SET,direct-process,DIRECT-PROXY
  - RULE-SET,direct-media,DIRECT-PROXY
  - RULE-SET,direct-private,DIRECT-PROXY

  # =====================================================================
  # 🟧 特殊路由
  # =====================================================================
  - RULE-SET,route-ai,AI-PROXY
  - RULE-SET,route-fastly,WARP-PROXY
  - RULE-SET,route-hls,HLS-PROXY
  - RULE-SET,route-drm,DRM-PROXY
  - RULE-SET,route-region,REGION-PROXY
  - RULE-SET,route-bankgov,BANKGOV-PROXY,no-resolve

  # =====================================================================
  # 🟥 Security（合併 MRS）
  # =====================================================================
  - RULE-SET,combined-security,REJECT

  # 🟥 Network Ports（獨立 classical 規則）
  - RULE-SET,network-ports,REJECT

  # =====================================================================
  # 🟩 WebView2
  # Security 照擋，但跳過後續 Privacy / Ads
  # =====================================================================
  - RULE-SET,direct-webview2,DIRECT-PROXY

  # =====================================================================
  # 🟥 Privacy（合併 MRS：Native Trackers / Custom）
  # =====================================================================
  - RULE-SET,combined-privacy,REJECT
  # =====================================================================
  # 🟥 Ads（合併 MRS）
  # =====================================================================
  - RULE-SET,combined-ads,REJECT
  # =====================================================================
  # 🌐 Default
  # =====================================================================
  - MATCH,PROXY
