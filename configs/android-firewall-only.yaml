    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/proxy/hls.yaml
    path: rules/proxy/hls.yaml
  route-drm:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/proxy/drm.yaml
    path: rules/proxy/drm.yaml
  route-bankgov:
