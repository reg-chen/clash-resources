# =====================================================================
# Android Firewall-only / No-VPN
# - No VPN proxy-providers / proxy-groups / VPN endpoints
# - DIRECT allow/bypass rules retain original ordering
# - Security / Privacy / Ads remain REJECT firewall layers
# =====================================================================

# Client profile validators may require at least one proxy entry even for
# firewall-only operation. This proxy is still a plain DIRECT outbound.
proxies:
  - name: DIRECT-DUMMY
    type: direct
    udp: true

ntp:
  enable: true
  write-to-system: false
  server: time.stdtime.gov.tw
  port: 123
  interval: 30

# 共用 Rule Provider 設定（YAML merge key）
x-rule-provider-common: &RULE-PROVIDER
  interval: 3600
  proxy: DIRECT

rule-providers:
  direct-dns:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/direct/dns.yaml
    path: rules/direct/dns.yaml
  direct-process:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/direct/process.yaml
    path: rules/direct/process.yaml
  direct-android:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/direct/android.yaml
    path: rules/direct/android.yaml
  direct-media:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/direct/media.yaml
