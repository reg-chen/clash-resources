# =====================================================================
# Android Firewall-only / No-VPN
# - No VPN proxy-providers / proxy-groups / VPN endpoints
# - DIRECT allow/bypass rules retain original ordering
# - Security / Privacy / Ads remain REJECT firewall layers
# =====================================================================

# Client profile validators may require at least one proxy entry even for
# firewall-only operation. This proxy is still a plain DIRECT outbound.
proxies:
  - name: DIRECT-DUMMY
    type: direct
    udp: true

ntp:
  enable: true
  write-to-system: false
  server: time.stdtime.gov.tw
  port: 123
  interval: 30

# 共用 Rule Provider 設定（YAML merge key）
x-rule-provider-common: &RULE-PROVIDER
  interval: 3600
  proxy: DIRECT

rule-providers:
  combined-security:
    <<: *RULE-PROVIDER
    type: http
    behavior: domain
    format: mrs
    url: https://rules.reginald.win/security/mrs/combined.mrs
    path: rules/security/mrs/combined.mrs

  combined-security-ip:
    <<: *RULE-PROVIDER
    type: http
    behavior: ipcidr
    format: mrs
    url: https://rules.reginald.win/security/mrs/combined-ip.mrs
    path: rules/security/mrs/combined-ip.mrs

  combined-privacy:
    <<: *RULE-PROVIDER
    type: http
    behavior: domain
    format: mrs
    url: https://rules.reginald.win/privacy/mrs/combined.mrs
    path: rules/privacy/mrs/combined.mrs

  combined-ads:
    <<: *RULE-PROVIDER
    type: http
    behavior: domain
    format: mrs
    url: https://rules.reginald.win/ads/mrs/combined.mrs
    path: rules/ads/mrs/combined.mrs

  reject-confirmed:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/confirmed/custom.yaml
    path: rules/confirmed/custom.yaml

  direct-dns:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/direct/dns.yaml
    path: rules/direct/dns.yaml
  direct-process:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/direct/process.yaml
    path: rules/direct/process.yaml
  direct-android:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/direct/android.yaml
    path: rules/direct/android.yaml
  direct-media:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/direct/media.yaml
    path: rules/direct/media.yaml
  route-ai:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/proxy/ai.yaml
    path: rules/proxy/ai.yaml
  route-hls:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/proxy/hls.yaml
    path: rules/proxy/hls.yaml
  route-drm:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/proxy/drm.yaml
    path: rules/proxy/drm.yaml
  route-bankgov:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/proxy/bankgov.yaml
    path: rules/proxy/bankgov.yaml
  network-ports:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://rules.reginald.win/network/ports.yaml
    path: rules/network/ports.yaml
  # Local-only private provider; private.yaml is intentionally not stored in this repository.
  direct-private:
    type: file
    behavior: classical
    path: private.yaml
rules:
- RULE-SET,reject-confirmed,REJECT
- RULE-SET,direct-dns,DIRECT
- RULE-SET,direct-android,DIRECT
- RULE-SET,direct-process,DIRECT
- RULE-SET,direct-media,DIRECT
- RULE-SET,direct-private,DIRECT
- RULE-SET,route-ai,DIRECT
- RULE-SET,route-hls,DIRECT
- RULE-SET,route-drm,DIRECT
- RULE-SET,route-bankgov,DIRECT,no-resolve
- RULE-SET,combined-security,REJECT
- RULE-SET,combined-security-ip,REJECT,no-resolve
# Network port restrictions (classical)
- RULE-SET,network-ports,REJECT
- RULE-SET,combined-privacy,REJECT
- RULE-SET,combined-ads,REJECT
- MATCH,DIRECT-DUMMY
ipv6: true
mode: rule
mixed-port: 7890
socks-port: 7891
port: 7892
redir-port: 0
tproxy-port: 0
allow-lan: false
unified-delay: true
tcp-concurrent: false
log-level: info
find-process-mode: strict
bind-address: '*'
lan-allowed-ips:
- 0.0.0.0/0
- ::/0
lan-disallowed-ips: []
authentication: []
skip-auth-prefixes:
- 127.0.0.1/32
- ::1/128
tun:
