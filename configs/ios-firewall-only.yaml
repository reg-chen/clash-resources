# =====================================================================
# iOS / iPadOS Firewall-only / No-VPN — Mihomo compatibility
# - Self-contained: no local private.yaml dependency
# - No process matching: Mihomo does not expose Android-style package matching on iOS
# - Reduced rule-provider set to stay within iOS Network Extension memory constraints
# - No VPN endpoints; DIRECT-DUMMY is a plain DIRECT outbound required by some clients
# =====================================================================

ipv6: true
mode: rule
log-level: info

# Some Mihomo clients require proxies or proxy-providers to exist.
# DIRECT-DUMMY is a plain DIRECT outbound; no VPN proxy node is configured.
proxies:
  - name: DIRECT-DUMMY
    type: direct
    udp: true

x-rule-provider-common: &RULE-PROVIDER
  interval: 3600
  proxy: DIRECT

rule-providers:
  direct-dns:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/direct/dns.yaml
    path: ./rules/direct/dns.yaml
  direct-ios:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/direct/ios.yaml
    path: ./rules/direct/ios.yaml
  direct-media:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/direct/media.yaml
    path: ./rules/direct/media.yaml
  route-ai:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/proxy/ai.yaml
    path: ./rules/proxy/ai.yaml
  route-hls:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/proxy/hls.yaml
    path: ./rules/proxy/hls.yaml
  route-drm:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/proxy/drm.yaml
    path: ./rules/proxy/drm.yaml
  route-bankgov:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/proxy/bankgov.yaml
    path: ./rules/proxy/bankgov.yaml
  security-custom:
    <<: *RULE-PROVIDER
    type: http
    behavior: domain
    format: text
    url: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/security/custom.txt
    path: ./rules/security/custom.txt
  security-riskport:
    <<: *RULE-PROVIDER
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/security/riskport.yaml
    path: ./rules/security/riskport.yaml
  privacy-custom:
    <<: *RULE-PROVIDER
    type: http
    behavior: domain
    format: text
    url: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/privacy/custom.txt
    path: ./rules/privacy/custom.txt
  ads-custom:
    <<: *RULE-PROVIDER
    type: http
    behavior: domain
    format: text
    url: https://cdn.jsdelivr.net/gh/reg-chen/clash-resources@main/rules/ads/custom.txt
    path: ./rules/ads/custom.txt
  ads-antiad:
    <<: *RULE-PROVIDER
    type: http
    behavior: domain
    format: mrs
    url: https://anti-ad.net/mihomo.mrs
    path: ./rules/ads/antiad.mrs

rules:
  - IP-CIDR6,::/0,REJECT,no-resolve
  - RULE-SET,direct-dns,DIRECT
  - RULE-SET,direct-ios,DIRECT
  - RULE-SET,direct-media,DIRECT
  - RULE-SET,route-ai,DIRECT
  - RULE-SET,route-hls,DIRECT
  - RULE-SET,route-drm,DIRECT
  - RULE-SET,route-bankgov,DIRECT,no-resolve
  - RULE-SET,security-custom,REJECT
  - RULE-SET,security-riskport,REJECT
  - RULE-SET,privacy-custom,REJECT
  - RULE-SET,ads-custom,REJECT
  - RULE-SET,ads-antiad,REJECT
  - MATCH,DIRECT-DUMMY

dns:
  enable: true
  ipv6: false
